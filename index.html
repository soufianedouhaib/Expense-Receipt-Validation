<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Receipt Validation — Applied AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="welcome-body">

  <main class="welcome">
    <div class="welcome-card">

      <img class="welcome-logo" src="logo.png" alt="Applied AI" width="846" height="140">
      <h1 class="welcome-title">Expense Receipt Validation</h1>

      <!-- ============ signed out ============ -->
      <section id="view-signin" hidden>
        <p class="welcome-sub" id="signin-sub">
          Sign in with your work account to file an expense claim or review your team's.
        </p>
        <a class="btn btn-google" href="/api/auth/google" id="signin-btn">
          <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18Z"/>
            <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33Z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58Z"/>
          </svg>
          Sign in with Google
        </a>
        <p class="welcome-foot" id="domain-note"></p>
      </section>

      <!-- ============ choose a role ============ -->
      <section id="view-roles" hidden>
        <p class="welcome-sub">
          Signed in as <strong id="who-name"></strong>. Choose how you want to work.
        </p>

        <div class="role-grid" id="role-grid"></div>

        <button type="button" class="link-btn" id="signout-link">Sign out</button>
      </section>

      <!-- ============ not configured ============ -->
      <section id="view-unconfigured" hidden>
        <p class="welcome-sub">
          Sign-in is not set up on this deployment yet. Add the Google credentials
          in Vercel and redeploy — the README has the steps.
        </p>
      </section>

      <p class="welcome-error" id="welcome-error" hidden></p>

      <div class="welcome-loading" id="welcome-loading">
        <div class="spinner" aria-hidden="true"></div>
      </div>

    </div>
  </main>

  <script src="welcome.js"></script>
</body>
</html>
