<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings — Expense Receipt Validation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-loading">

  <header class="topbar">
    <img class="logo" src="logo.png" alt="Applied AI" width="846" height="140">
    <span class="topbar-title">Settings</span>
    <div class="topbar-right">
      <span class="session"><span class="session-dot" aria-hidden="true"></span><span id="who"></span></span>
      <a class="btn btn-chrome" href="workspace.html?scope=all">All claims</a>
      <a class="btn btn-chrome" href="/">Switch</a>
      <button type="button" class="btn btn-chrome" id="signout-btn">Sign out</button>
    </div>
  </header>

  <main class="shell">

    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="workspace.html?scope=all">Expense Receipt Validation</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">Settings</span>
    </nav>

    <div class="intro">
      <h1>Settings</h1>
      <p>Workflow connection details for this instance.</p>
    </div>

    <p class="page-error" id="page-error" hidden></p>

    <div class="stack" id="settings-body" hidden>

      <section class="card set-card" aria-labelledby="h-conn">
        <h2 class="set-eyebrow" id="h-conn">Workflow connection</h2>
        <dl class="set-rows" id="conn-rows"></dl>
      </section>

      <section class="card set-card" aria-labelledby="h-storage">
        <h2 class="set-eyebrow" id="h-storage">Storage</h2>
        <dl class="set-rows" id="storage-rows"></dl>
      </section>

      <section class="card set-card" aria-labelledby="h-support">
        <h2 class="set-eyebrow" id="h-support">Support</h2>
        <p class="set-lede">Need help with this instance or the underlying Opus workflow?</p>
        <a class="btn btn-primary" id="support-btn" href="#">Contact Opus customer support</a>
        <p class="hint" id="support-hint"></p>
      </section>

    </div>

    <div class="welcome-loading" id="loading">
      <div class="spinner" aria-hidden="true"></div>
    </div>

  </main>

  <footer class="foot"><span>Applied AI · Expense Receipt Validation</span></footer>

  <script src="settings.js"></script>
</body>
</html>
