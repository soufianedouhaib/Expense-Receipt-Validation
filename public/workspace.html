<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review — Expense Receipt Validation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-loading">

  <header class="topbar">
    <img class="logo" src="logo.png" alt="Applied AI" width="846" height="140">
    <span class="topbar-title" id="mode-title">Review</span>
    <div class="topbar-right">
      <span class="session"><span class="session-dot" aria-hidden="true"></span><span id="who"></span></span>
      <a class="btn btn-chrome" href="submit.html">New claim</a>
      <a class="btn btn-chrome" href="settings.html" id="settings-link" hidden>Settings</a>
      <a class="btn btn-chrome" href="/" id="switch-btn">Switch</a>
      <button type="button" class="btn btn-chrome" id="signout-btn">Sign out</button>
    </div>
  </header>

  <p class="page-error" id="page-error" hidden></p>

  <!-- ===================== WORKSPACE ===================== -->
  <section id="view-work">
    <div class="split">

      <div class="split-list">
        <div class="list-filters">
          <div class="f1">
            <input type="search" id="search" placeholder="Search name, email or category" aria-label="Search claims">
          </div>
          <div class="f2">
            <select id="filter-status" aria-label="Filter by outcome">
              <option value="all">All outcomes</option>
              <option value="approved">Approved</option>
              <option value="attention">Needs attention</option>
              <option value="running">Running</option>
              <option value="failed">Did not complete</option>
            </select>
          </div>
        </div>

        <div class="list-filters list-filters-period">
          <div class="f1">
            <select id="filter-period" aria-label="Filter by period">
              <option value="all">All time</option>
              <option value="this-month">This month</option>
              <option value="last-month">Last month</option>
              <option value="last-3">Last 3 months</option>
              <option value="last-30">Last 30 days</option>
              <option value="ytd">This year</option>
              <option value="custom">Custom range…</option>
            </select>
          </div>
        </div>

        <div class="list-filters list-filters-dates" id="custom-range" hidden>
          <div class="f1">
            <label class="fl" for="date-from">From</label>
            <input type="date" id="date-from">
          </div>
          <div class="f1">
            <label class="fl" for="date-to">To</label>
            <input type="date" id="date-to">
          </div>
        </div>

        <div class="list-count">
          <span id="count-total">Loading…</span>
          <span class="count-right">
            <span class="pill" id="count-attention"></span>
            <a class="count-export" id="export-link" href="#">Export CSV</a>
          </span>
        </div>

        <div class="list-rows" id="rows"></div>
        <p class="list-empty" id="list-empty" hidden>No claims match that filter.</p>
      </div>

      <div class="split-detail" id="detail">
        <div class="detail-empty">Select a claim on the left to see the full report.</div>
      </div>

    </div>
  </section>

  <script src="workspace.js"></script>
</body>
</html>
